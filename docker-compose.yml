version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: devport-postgres
    restart: always
    environment:
      POSTGRES_DB: devport
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - devport_pgdata:/var/lib/postgresql/data

volumes:
  devport_pgdata:

